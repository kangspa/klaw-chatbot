[project]
name = "klaw-chatbot"
version = "0.1.0"
description = "국내법 상담 챗봇"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # --- 웹 서버 (FastAPI + Uvicorn) ---
    "fastapi>=0.131.0",
    "uvicorn>=0.41.0",
    # --- 환경 변수 로드 ---
    "dotenv>=0.9.9",
    # --- LangChain / LangGraph 코어 ---
    "langchain-core>=0.3.0",
    "langchain-community>=0.4.1",   # SearxSearchWrapper / SearxSearchResults
    "langgraph>=1.0.10",            # StateGraph + MemorySaver (in-memory 체크포인터)
    "langchain-mcp-adapters>=0.1.0",
    # --- LLM 게이트웨이 (LiteLLM 단일 경유) ---
    "litellm>=1.52.0",
    "langchain-litellm>=0.2.0",
    # --- 벡터 DB ---
    "qdrant-client>=1.17.1",
    # --- 관계형 DB (회원/세션/메시지 저장) ---
    "asyncpg>=0.30.0",
    # --- 인증 (Google ID 토큰 RS256 검증 + 자체 세션 토큰 HS256 발급) ---
    "pyjwt[crypto]>=2.10.0",
    # --- 웹 크롤링 (page_crawl4ai 도구) ---
    "crawl4ai>=0.8.5",
    # --- 별표 이미지 OCR (tool_annex_ocr) ---
    # paddlepaddle은 CPU 기본. GPU 서버에서는 paddlepaddle-gpu를 별도 설치하면
    # 코드가 런타임에 CUDA 지원을 감지해 자동으로 GPU를 사용한다.
    "paddleocr>=3.0.0",
    "paddlepaddle>=3.0.0",
    "pymupdf>=1.25.0",
    "requests>=2.32.0",
    # --- 유틸 ---
    "cachetools>=7.0.4",
    "pydantic>=2.10.0",
]
