[project]
name = "klaw-chatbot"
version = "0.1.0"
description = "국내법 상담 챗봇"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # --- 웹 서버 (FastAPI + Uvicorn) ---
    "fastapi>=0.131.0",
    "uvicorn>=0.41.0",
    # --- 환경 변수 로드 ---
    "dotenv>=0.9.9",
    # --- LangChain / LangGraph 코어 ---
    "langchain-core>=0.3.0",
    "langchain-community>=0.4.1",   # SearxSearchWrapper / SearxSearchResults
    "langgraph>=1.0.10",            # StateGraph + MemorySaver (in-memory 체크포인터)
    "langchain-mcp-adapters>=0.1.0",
    # --- LLM 제공자 (api/llm_gateway가 '접두사/모델명'으로 선택) ---
    "langchain-openai>=1.6.6",          # openai/ + OpenAI 호환 서버(lmstudio/, vllm/, huggingface/)
    "langchain-anthropic>=1.7.4",       # anthropic/
    "langchain-google-genai>=4.4.0",    # gemini/ + Gemini 임베딩(google-genai)
    "langchain-ollama>=1.1.0",          # ollama/
    # --- 벡터 DB ---
    "qdrant-client>=1.17.1",
    # --- 관계형 DB (회원/세션/메시지 저장) ---
    "asyncpg>=0.30.0",
    # --- 인증 (Google ID 토큰 RS256 검증 + 자체 세션 토큰 HS256 발급) ---
    "pyjwt[crypto]>=2.10.0",
    # --- 웹 크롤링 (page_crawl4ai 도구) ---
    "crawl4ai>=0.8.5",
    # --- 별표 이미지 OCR (tool_annex_ocr) ---
    # paddlepaddle은 CPU 기본. GPU 서버에서는 paddlepaddle-gpu를 별도 설치하면
    # 코드가 런타임에 CUDA 지원을 감지해 자동으로 GPU를 사용한다.
    "paddleocr>=3.0.0",
    "paddlepaddle>=3.0.0",
    "pymupdf>=1.25.0",
    "requests>=2.32.0",
    # --- 유틸 ---
    "cachetools>=7.0.4",
    "pydantic>=2.10.0",
]

[tool.uv]
# crawl4ai가 필수 의존성으로 선언한 unclecode-litellm(litellm 포크)을 설치하지 않는다.
# crawl4ai는 LLM 추출 전략·CLI에서만 litellm을 함수 내부에서 지연 import하고,
# 이 프로젝트는 기본 크롤링(AsyncWebCrawler.arun)만 쓰므로 필요 없다.
# 불가능한 환경 마커로 override하면 uv가 해당 패키지를 해석·설치 대상에서 제외한다.
override-dependencies = ["unclecode-litellm; sys_platform == 'never'"]
